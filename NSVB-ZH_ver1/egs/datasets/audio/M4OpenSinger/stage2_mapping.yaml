# Stage 2: train ResidualM on top of a frozen Stage 1 CVAE.
# Requires a valid Stage 1 checkpoint (path below).

base_config:
  - egs/datasets/audio/M4OpenSinger/base.yaml

task_stage: 'stage2'

# Must point to a successful Stage 1 run.
load_ckpt: 'checkpoints/nsvb_zh_stage1/model_ckpt_best.ckpt'
freeze_cvae_in_stage2: true

# Residual mapping function M
m_kernel_size: 1                         # try 3 if ||Δ|| < 3 % after 30k steps
m_hidden_dim: 256
m_num_layers: 4

# Warmup: no D_z gradient to M for the first 5k steps (M learns identity-ish).
d_z_warmup_steps: 5000

# Conditional D_z
soft_bucket_num: 5
soft_bucket_sigma: 0.3
phoneme_vocab_size: 80                   # adjust to your zh phoneme dict
phoneme_embed_dim: 32
dz_hidden_dim: 256
dz_num_layers: 4
dz_kernel_size: 5

# Loss weights
lambda_adv_z: 1.0
lambda_adv_mel: 0.2
lambda_patchnce: 1.0
lambda_ppg: 0.5
lambda_identity_pro: 0.1
identity_pro_prob: 0.2

# TTUR
opt_m_lr: 1.0e-4
opt_dz_lr: 4.0e-4
opt_dmel_lr: 1.0e-5
opt_patchnce_lr: 1.0e-4

# PatchNCE
patchnce_proj_dim: 64
patchnce_temp: 0.07
patchnce_num_patches: 128

# PPG extractor (Chinese)
ppg_extractor_ckpt: 'checkpoints/ppg_extractor_zh/model.ckpt'

# Training
max_updates: 120000
max_sentences: 24
accumulate_grad_batches: 1
val_check_interval: 2000
save_interval: 5000
num_sanity_val_steps: 2
