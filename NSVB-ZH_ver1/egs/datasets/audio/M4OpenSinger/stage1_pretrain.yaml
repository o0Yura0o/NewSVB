# Stage 1 pretrain: CVAE on M4+OpenSinger combined.
# After ~50--80k steps, run scripts/probe_dataset_discriminability.py.
#   - Case A (probe < 0.60): keep use_grl=false, continue to full Stage 1.
#   - Case B (0.60 <= probe < 0.75): set use_grl=true, restart or finetune.
#   - Case C (probe >= 0.75): stop; re-label via MOSNet or switch to pairs.

base_config:
  - egs/datasets/audio/M4OpenSinger/base.yaml

task_stage: 'stage1'

# Probe gating — flip on after probe returns Case B.
use_grl: false
grl_lambda_start: 0.1
grl_lambda_end: 0.3
grl_warmup_steps: 30000
d_domain_hidden: 128
opt_d_domain_lr: 2.0e-4

# Training
lr: 2.0e-4
max_updates: 200000
max_sentences: 32
accumulate_grad_batches: 1
num_sanity_val_steps: 2
val_check_interval: 2000
save_interval: 5000

# Early stop gate (SSIM on val mel reconstruction). Set by hand after the half-
# trained probe decision.
val_min_mel_ssim: 0.85
